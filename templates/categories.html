{% extends 'admin_base.html' %}{% block admin_title %}Tus categorías{% endblock %}{% block admin_content %}<div class="category-layout"><section class="panel"><h2>Agregar categoría</h2><p class="field-hint">Organiza tus productos para que sea más fácil encontrarlos.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre<input name="nombre" maxlength="80" placeholder="Ej.: Ropa infantil" required></label><button class="button dark">Crear categoría +</button></form></section><section class="panel"><h2>Categorías actuales</h2>{% for c in categories %}<form class="category-edit" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="id" value="{{ c.id }}"><label class="sr-only" for="category-{{ c.id }}">Nombre de la categoría</label><input id="category-{{ c.id }}" name="nombre" value="{{ c.nombre }}" maxlength="80" required><button class="button outline small">Guardar</button></form>{% endfor %}</section></div>{% endblock %}
