{% extends 'base.html' %}{% block content %}<section class="login-panel panel"><p class="eyebrow">SOLO PARA TI</p><h1>Tu catálogo,<br><em>en tus manos.</em></h1><p>Ingresa para administrar productos, fotos y categorías.</p>{% if configured %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label><button class="button dark">Ingresar →</button></form>{% else %}<div class="message">El acceso de administración aún no está configurado.</div>{% endif %}<a class="back" href="{{ url_for('catalog') }}">← Volver al catálogo</a></section>{% endblock %}
